[package]
name = "event-graph-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.3", features = ["fullstack", "router"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
gloo-timers = { version = "0.3", features = ["futures"] }
neo4rs = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
default = []
server = ["dioxus/server", "dep:neo4rs", "dep:tokio"]
web = ["dioxus/web"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlElement", "Document", "Window", "Element", "DomRect", "SvgsvgElement", "SvgMatrix", "SvgPoint", "Navigator", "Clipboard"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

